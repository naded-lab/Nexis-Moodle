name: Deploy Nexis Moodle Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - 'schema.sql'
      - 'pyproject.toml'
      - '.github/workflows/cloudflare-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Install Python Worker tooling
        run: uv sync

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEXIS_MASTER_KEY: ${{ secrets.NEXIS_MASTER_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          printf "%s" "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf "%s" "$NEXIS_MASTER_KEY" | npx wrangler secret put NEXIS_MASTER_KEY
          printf "%s" "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET

      - name: Set Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -d "url=https://nexis-moodle.nadedashraf.workers.dev" \
            -d "secret_token=${WEBHOOK_SECRET}"

      - name: Verify Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | jq '{ok, result: {url: .result.url, pending_update_count: .result.pending_update_count, last_error_message: .result.last_error_message, last_error_date: .result.last_error_date}}'

      - name: Test Worker webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -fsS -o /tmp/worker_response -w "HTTP %{http_code}\n" -X POST "https://nexis-moodle.nadedashraf.workers.dev"             -H "Content-Type: application/json"             -H "X-Telegram-Bot-Api-Secret-Token: ${WEBHOOK_SECRET}"             -d '{"update_id":999999,"message":{"message_id":999999,"chat":{"id":999999,"type":"private"},"from":{"id":999999},"text":"health-check"}}'
          cat /tmp/worker_response

      - name: Capture Worker runtime error
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          timeout 30s npx wrangler tail nexis-moodle --format json > /tmp/worker-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 5
          curl -sS -X POST "https://nexis-moodle.nadedashraf.workers.dev"             -H "Content-Type: application/json"             -H "X-Telegram-Bot-Api-Secret-Token: ${WEBHOOK_SECRET}"             -d '{"update_id":888888,"message":{"message_id":888888,"chat":{"id":999999,"type":"private"},"from":{"id":999999},"text":"/start"}}'             || true
          sleep 5
          kill $TAIL_PID 2>/dev/null || true
          cat /tmp/worker-tail.log || true

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler d1 execute nexis-moodle-db --remote --file=schema.sql
